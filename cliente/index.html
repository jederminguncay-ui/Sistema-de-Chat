<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Chat — UIDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="auth-screen" class="auth-screen">
    <section class="auth-card">
      <header class="auth-brand">
        <span class="brand-mark" aria-hidden="true">
          <span class="brand-dot"></span>
        </span>
        <div>
          <h1 class="brand-title">Sistema de Chat</h1>
          <p class="brand-sub">Proyecto Integrador · UIDE</p>
        </div>
      </header>

      <div class="auth-tabs" role="tablist">
        <button id="tab-login" class="auth-tab is-active" role="tab">Iniciar sesión</button>
        <button id="tab-register" class="auth-tab" role="tab">Crear cuenta</button>
      </div>
      <div id="login-form" class="auth-form">
        <label class="field">
          <span>Nombre de usuario</span>
          <input id="login-username" type="text" autocomplete="username" placeholder="tu_usuario" />
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </label>
        <button id="login-btn" class="btn-primary">Entrar</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </div>
      <div id="register-form" class="auth-form is-hidden">
        <div class="field-row">
          <label class="field">
            <span>Nombre</span>
            <input id="reg-first" type="text" placeholder="Nombre" />
          </label>
          <label class="field">
            <span>Apellido</span>
            <input id="reg-last" type="text" placeholder="Apellido" />
          </label>
        </div>
        <label class="field">
          <span>Nombre de usuario</span>
          <input id="reg-username" type="text" placeholder="usuario_unico" />
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input id="reg-password" type="password" placeholder="Crea una contraseña" />
        </label>
        <button id="register-btn" class="btn-primary">Crear cuenta</button>
        <p id="register-error" class="form-error" role="alert"></p>
      </div>
    </section>
  </main>

  <div id="app-screen" class="app-screen is-hidden">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="me">
          <span class="avatar" id="me-avatar">?</span>
          <div class="me-info">
            <strong id="me-name">—</strong>
            <span id="me-username" class="muted">@—</span>
          </div>
        </div>
        <button id="logout-btn" class="btn-ghost" title="Cerrar sesión" aria-label="Cerrar sesión">
          Salir
        </button>
      </header>

      <div class="search-box">
        <input id="search-input" type="text" placeholder="Buscar usuarios por @usuario" />
        <div id="search-results" class="search-results is-hidden"></div>
      </div>

      <nav id="conversation-list" class="conversation-list" aria-label="Conversaciones"></nav>
    </aside>

    <section class="chat">
      <div id="chat-empty" class="chat-empty">
        <span class="brand-mark big" aria-hidden="true"><span class="brand-dot"></span></span>
        <h2>Selecciona una conversación</h2>
        <p class="muted">Busca un usuario o abre un chat existente para comenzar.</p>
      </div>

      <div id="chat-active" class="chat-active is-hidden">
        <header class="chat-header">
          <span class="avatar" id="peer-avatar">?</span>
          <div class="chat-peer">
            <strong id="peer-name">—</strong>
            <span id="peer-username" class="muted">@—</span>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <footer class="composer">
          <input id="message-input" type="text" placeholder="Escribe un mensaje…" autocomplete="off" />
          <button id="send-btn" class="btn-send" aria-label="Enviar">Enviar</button>
        </footer>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
